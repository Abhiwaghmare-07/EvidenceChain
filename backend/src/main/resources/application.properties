server.port=8080

# Spring MVC JSP Configuration
spring.mvc.view.prefix=/WEB-INF/jsp/
spring.mvc.view.suffix=.jsp

# H2 Database (File Mode for persistence across restarts)
spring.datasource.url=jdbc:h2:file:./data/evidencechain;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# File Storage & Multipart Config
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
evidencechain.storage.path=./storage

# JWT Configuration
# IMPORTANT: Set the JWT_SECRET environment variable in production.
# Example (Linux/Mac): export JWT_SECRET=your-256-bit-secret-here
# Example (Windows):   $env:JWT_SECRET = "your-256-bit-secret-here"
# The fallback value below is for local development ONLY — change it before deploying.
evidencechain.jwt.secret=${JWT_SECRET:change-me-in-production-use-a-256bit-hex-string}
evidencechain.jwt.expiration-ms=86400000

# AI Anomaly Threshold (Risk score >= 75 triggers account lockout)
evidencechain.anomaly.lockout-threshold=75
evidencechain.anomaly.max-downloads-window-mins=10
evidencechain.anomaly.max-downloads-allowed=5
evidencechain.anomaly.max-failed-verifications=3
